# ========================================
# 小米 manet 内核构建工作流
# ========================================
# 此工作流独立于通用 build.yml，专门用于构建
# 小米 manet (Android 14 / Linux 6.1) GKI 内核
#
# 工作流职责:
#   1. 通过 AOSP kernel manifest 获取 common/build/Kleaf 依赖
#   2. 克隆 MiCode/Xiaomi_Kernel_OpenSource (bsp-manet-u-oss) 到 msm-kernel
#   3. 校验 Xiaomi 提交与 android/ACK_SHA (默认跟随上游最新，可锁定)
#   4. 调用 scripts/apply_manet_patches.sh 应用补丁到 common
#   5. 使用 Bazel 构建 //msm-kernel:manet_gki_dist
#   6. 上传内核 dist 产物，并附带一个可直接刷入的 AnyKernel3 包
# ========================================

name: 小米 manet 内核构建

# 适配 Node.js 24
# ==================== 源码引用 ====================
# 默认策略: 跟随上游最新
#   - XIAOMI_COMMIT / EXPECTED_ACK_SHA 留空 => 构建时动态解析分支 HEAD 与 android/ACK_SHA
#   - 需要复现历史构建时，在触发页面显式填入 SHA 覆盖
# 说明: 动态解析是"取分支最新提交"，不是"每次构建结果都不同"——解析到的具体 SHA
#       会打印在日志里，可据此复现。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  XIAOMI_REPO: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git"
  XIAOMI_BRANCH: "bsp-manet-u-oss"
  XIAOMI_DT_REPO: "https://github.com/MiCode/kernel_devicetree.git"
  AOSP_MANIFEST_URL: "https://android.googlesource.com/kernel/manifest"
  AOSP_MANIFEST_BRANCH: "common-android14-6.1-2023-06"
  AOSP_COMMON_URL: "https://android.googlesource.com/kernel/common"
  BAZEL_TARGET: "//msm-kernel:manet_gki_dist"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      # 源码引用无需人工指定：构建时自动从远端解析
      #   - Xiaomi 提交  = bsp-manet-u-oss 分支 HEAD
      #   - ACK 基线     = Xiaomi 源码 android/ACK_SHA
      # 解析结果会打印到日志，可据此复现。

      # ==================== KernelSU 配置 ====================
      ksu_ref:
        description: "ReSukiSU 分支/提交 (main/builtin/自定义 commit hash)"
        required: false
        type: string
        default: "main"

      # ==================== Droidspaces 配置 ====================
      droidspaces:
        description: "Droidspaces 容器支持槽位"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "678"
      droidspaces_extras:
        description: "Droidspaces 可选配置 (USER_NS / NAT66 / UFW / Fail2ban)"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces NTSync 支持 (需启用 Droidspaces)"
        required: false
        type: boolean
        default: false

      # ==================== 功能开关 ====================
      enable_susfs:
        description: "启用 SUSFS"
        required: false
        type: boolean
        default: true
      use_zram:
        description: "启用 ZRAM LZ4 增强算法"
        required: false
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: true

      # ==================== 打包 ====================
      build_anykernel3:
        description: "额外产出 AnyKernel3 可刷入包"
        required: false
        type: boolean
        default: true

jobs:
  build-manet:
    name: "manet-android14-6.1-ReSukiSU"
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      # ==================== 解析源码引用 ====================
      # 全自动：从远端解析，无需人工指定
      #   - Xiaomi 提交 = bsp-manet-u-oss 分支当前 HEAD
      #   - ACK 基线    = 稍后读取 Xiaomi 源码自带的 android/ACK_SHA
      # 解析结果打印到日志，可据此复现同一次构建。
      - name: 解析源码引用
        id: refs
        run: |
          set -euo pipefail

          echo "查询 $XIAOMI_BRANCH 分支 HEAD ..."
          XIAOMI_COMMIT="$(git ls-remote "$XIAOMI_REPO" "refs/heads/$XIAOMI_BRANCH" | awk '{print $1}')"
          [[ -n "$XIAOMI_COMMIT" ]] || { echo "::error::无法解析 $XIAOMI_BRANCH 分支 HEAD"; exit 1; }
          echo "解析到最新提交: $XIAOMI_COMMIT"

          echo "XIAOMI_COMMIT=$XIAOMI_COMMIT" >> $GITHUB_ENV

      # ==================== 构建信息摘要 ====================
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "    小米 manet 内核构建配置摘要"
          echo "========================================"
          echo "Android 版本  : android14"
          echo "内核版本      : 6.1"
          echo "设备          : Xiaomi manet"
          echo "Xiaomi 分支   : $XIAOMI_BRANCH"
          echo "Xiaomi 提交   : $XIAOMI_COMMIT  (远端自动解析)"
          echo "KSU 分支      : ${{ inputs.ksu_ref }}"
          echo "SUSFS         : ${{ inputs.enable_susfs }}"
          echo "Droidspaces   : ${{ inputs.droidspaces }}"
          echo "DS 可选配置   : ${{ inputs.droidspaces_extras }}"
          echo "NTSync        : ${{ inputs.droidspaces_ntsync }}"
          echo "ZRAM          : ${{ inputs.use_zram }}"
          echo "BBG           : ${{ inputs.use_bbg }}"
          echo "CVE-2026-43499: ${{ inputs.cve_2026_43499_patch }}"
          echo "AnyKernel3    : ${{ inputs.build_anykernel3 }}"
          echo "Bazel 目标    : $BAZEL_TARGET"
          echo "========================================"

      # ==================== 清理磁盘空间 ====================
      - name: 清理磁盘空间
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      # ==================== 检出仓库代码 ====================
      - name: 检出代码仓库
        uses: actions/checkout@v6

      # ==================== 安装编译依赖 ====================
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache python3 git curl build-essential libssl-dev bison flex libelf-dev dwarves wget

      # ==================== 配置 ccache ====================
      - name: 配置 ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # ==================== 恢复 ccache 缓存 ====================
      - name: 恢复 ccache 缓存
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: manet-android14-6.1-ccache-${{ github.sha }}
          restore-keys: |
            manet-android14-6.1-ccache-

      # ==================== 缓存 Bazel 磁盘缓存 ====================
      - name: 缓存 Bazel 磁盘缓存
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: manet-bazel-${{ github.sha }}
          restore-keys: |
            manet-bazel-

      # ==================== 配置 Git ====================
      - name: 配置 Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"

      # ==================== 初始化构建环境 ====================
      - name: 初始化构建环境
        run: |
          KERNEL_ROOT="$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p "$KERNEL_ROOT"

          cat >> $GITHUB_ENV << EOF
          KERNEL_ROOT=$KERNEL_ROOT
          EOF

          # 下载并配置 repo 工具
          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      # ==================== 初始化并同步 AOSP 内核源码 ====================
      # 必须先同步 AOSP manifest，确保 common/build/Kleaf 就位，
      # 再克隆 Xiaomi 源码到 msm-kernel，避免 repo 项目冲突
      #
      # 已弃用分支处理: Google 会把过期的 common-<branch> 移到 deprecated/ 下。
      # 此时 manifest 里仍写 "android14-6.1-2023-06"，但该 ref 已不存在，
      # repo sync 会报 "Cannot fetch kernel/common" /
      # "revision android14-6.1-2023-06 in kernel/common not found"。
      # 处理方式与项目 build.yml 一致: 探测到废弃后改写 manifest 里的分支名。
      - name: 初始化并同步 AOSP 内核源码
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          set -uo pipefail

          echo "初始化 repo，分支: $AOSP_MANIFEST_BRANCH"
          $REPO init --depth=1 -u "$AOSP_MANIFEST_URL" -b "$AOSP_MANIFEST_BRANCH" --repo-rev=v2.16

          # ---- 探测目标分支是否已被弃用 ----
          # manifest 分支形如 common-android14-6.1-2023-06，
          # 其中 common- 之后的部分才是 kernel/common 里的分支名。
          BRANCH_TAIL="${AOSP_MANIFEST_BRANCH#common-}"
          echo "探测 kernel/common 分支状态: $BRANCH_TAIL"
          REMOTE_BRANCH="$(git ls-remote "$AOSP_COMMON_URL" "$BRANCH_TAIL" 2>/dev/null || true)"
          echo "  ls-remote 结果: ${REMOTE_BRANCH:-<空>}"

          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            echo "::warning::分支已弃用，改写 manifest: $BRANCH_TAIL -> deprecated/$BRANCH_TAIL"
            DEFAULT_MANIFEST_PATH=".repo/manifests/default.xml"
            if [[ -f "$DEFAULT_MANIFEST_PATH" ]]; then
              sed -i "s|\"${BRANCH_TAIL}\"|\"deprecated/${BRANCH_TAIL}\"|g" "$DEFAULT_MANIFEST_PATH"
              grep -n "deprecated/${BRANCH_TAIL}" "$DEFAULT_MANIFEST_PATH" | head -3
            else
              echo "::error::未找到 $DEFAULT_MANIFEST_PATH"
              exit 1
            fi
          else
            echo "分支未弃用或无法判定，按原样同步"
          fi

          MAX_ATTEMPTS=4
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "========== repo sync 第 $attempt/$MAX_ATTEMPTS 次 =========="
            if $REPO sync -c -j$(nproc --all) --no-tags --retry-fetches=5; then
              echo "AOSP common 同步成功 (第 $attempt 次)"
              echo "HEAD: $(git -C common rev-parse HEAD 2>/dev/null || echo 'n/a')"
              exit 0
            fi
            echo "::warning::repo sync 第 $attempt 次失败，稍后重试"
            sleep 15
          done

          echo "::error::repo sync 连续 $MAX_ATTEMPTS 次失败"
          echo "::error::请检查: 1) android.googlesource.com 可达性 2) 分支是否被弃用"
          exit 1

      # ==================== 克隆 Xiaomi manet 源码 ====================
      # AOSP manifest 不包含 msm-kernel 项目，直接克隆 Xiaomi 源码到该目录。
      # 同样对网络抖动做重试。
      - name: 克隆 Xiaomi manet 源码
        run: |
          set -uo pipefail

          # 若 repo sync 意外创建了 msm-kernel 目录，先清除避免冲突
          if [[ -e "$KERNEL_ROOT/msm-kernel" ]]; then
            echo "::warning::msm-kernel 已存在，移除后重新克隆"
            rm -rf "$KERNEL_ROOT/msm-kernel"
          fi

          MAX_ATTEMPTS=4
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "========== 克隆 Xiaomi 源码 第 $attempt/$MAX_ATTEMPTS 次 =========="
            rm -rf "$KERNEL_ROOT/msm-kernel"
            if git clone --depth 1 "$XIAOMI_REPO" "$KERNEL_ROOT/msm-kernel" -b "$XIAOMI_BRANCH"; then
              if git -C "$KERNEL_ROOT/msm-kernel" fetch origin "$XIAOMI_COMMIT" --depth=1 \
                 && git -C "$KERNEL_ROOT/msm-kernel" checkout "$XIAOMI_COMMIT"; then
                echo "克隆并检出成功 (第 $attempt 次)"
                break
              fi
            fi
            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]]; then
              echo "::error::克隆 Xiaomi 源码连续 $MAX_ATTEMPTS 次失败"
              exit 1
            fi
            echo "::warning::第 $attempt 次克隆失败，稍后重试"
            sleep 15
          done

          # 校验 Xiaomi 提交
          ACTUAL_COMMIT="$(git -C "$KERNEL_ROOT/msm-kernel" rev-parse HEAD)"
          if [[ "$ACTUAL_COMMIT" != "$XIAOMI_COMMIT" ]]; then
            echo "::error::Xiaomi 提交校验失败: 期望 $XIAOMI_COMMIT, 实际 $ACTUAL_COMMIT"
            exit 1
          fi
          echo "Xiaomi 提交校验通过: $ACTUAL_COMMIT"
          git -C "$KERNEL_ROOT/msm-kernel" log -1 --format='提交日期: %ci%n提交信息: %s'

      # ==================== 校准 AOSP common 到 Xiaomi 期望的 ACK 基线 ====================
      # Xiaomi 源码的 android/ACK_SHA 指明它期望编译在哪个 AOSP common 提交上。
      # 该值由 Xiaomi 源码自身决定，自动读取，无需人工干预。
      - name: 校准 AOSP common 到 ACK 基线
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          set -euo pipefail

          ACK_SHA_FILE="$KERNEL_ROOT/msm-kernel/android/ACK_SHA"
          if [[ ! -f "$ACK_SHA_FILE" ]]; then
            echo "::error::ACK_SHA 文件不存在: $ACK_SHA_FILE"
            exit 1
          fi

          TARGET_ACK="$(tr -d '[:space:]' < "$ACK_SHA_FILE")"
          echo "从 Xiaomi 源码解析到 ACK_SHA: $TARGET_ACK"

          COMMON_REMOTE="$(git remote | head -n 1)"
          [[ -n "$COMMON_REMOTE" ]] || { echo "::error::common 没有可用 Git remote"; exit 1; }

          echo "拉取并切换 common 到: $TARGET_ACK"
          git fetch "$COMMON_REMOTE" "$TARGET_ACK" --depth=1
          git checkout "$TARGET_ACK"

          ACTUAL_COMMON_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_COMMON_SHA" != "$TARGET_ACK" ]]; then
            echo "::error::common 切换失败: 期望 $TARGET_ACK, 实际 $ACTUAL_COMMON_SHA"
            exit 1
          fi
          echo "common 已切换到: $ACTUAL_COMMON_SHA"
          git log -1 --format='提交日期: %ci%n提交信息: %s'
          echo "COMMON_SHA=$ACTUAL_COMMON_SHA" >> $GITHUB_ENV

      # ==================== 应用补丁 ====================
      - name: 应用 manet 补丁
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          SCRIPT="$GITHUB_WORKSPACE/scripts/apply_manet_patches.sh"

          ARGS=(
            --workspace "$KERNEL_ROOT"
            --droidspaces "${{ inputs.droidspaces }}"
            --ksu-ref "${{ inputs.ksu_ref }}"
          )

          if [[ "${{ inputs.enable_susfs }}" == "true" ]]; then
            ARGS+=(--enable-susfs)
          else
            ARGS+=(--disable-susfs)
          fi

          if [[ "${{ inputs.droidspaces_extras }}" == "true" ]]; then
            ARGS+=(--droidspaces-extras)
          fi

          if [[ "${{ inputs.droidspaces_ntsync }}" == "true" ]]; then
            ARGS+=(--ntsync)
          fi

          if [[ "${{ inputs.cve_2026_43499_patch }}" == "true" ]]; then
            ARGS+=(--cve)
          fi

          if [[ "${{ inputs.use_zram }}" == "true" ]]; then
            ARGS+=(--use-zram)
          fi

          if [[ "${{ inputs.use_bbg }}" == "true" ]]; then
            ARGS+=(--use-bbg)
          fi

          echo "执行: bash $SCRIPT ${ARGS[*]}"
          bash "$SCRIPT" "${ARGS[@]}"

      # ==================== 收集补丁冲突文件 ====================
      - name: 收集补丁冲突文件
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          mapfile -t REJS < <(find "$KERNEL_ROOT" -type f -name '*.rej' 2>/dev/null || true)
          REJ_COUNT=${#REJS[@]}
          echo "发现 $REJ_COUNT 个 .rej 文件"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      # ==================== 准备 Bazel 工作区 ====================
      # Qualcomm 的 Bazel 构建要求工作区根目录存在 build/ 包，
      # msm-kernel/msm_platforms.bzl 里 load("//build:msm_kernel_extensions.bzl")
      # 依赖它。AOSP 的 kernel/build 仓库只在根级放 msm_kernel_extensions.bzl，
      # 不一定带 BUILD 文件，缺少时 Bazel 会报:
      #   Every .bzl file must have a corresponding package, but
      #   '//build:msm_kernel_extensions.bzl' does not have one.
      # reposync 出来的 kernel/build 目录通常没有 BUILD.bazel，这里补齐。
      - name: 准备 Bazel 工作区
        run: |
          set -euo pipefail

          BUILD_PKG="$KERNEL_ROOT/build"
          if [[ ! -d "$BUILD_PKG" ]]; then
            echo "::warning::$BUILD_PKG 不存在，创建空目录并补齐所需扩展文件"
            mkdir -p "$BUILD_PKG"
          fi

          # 1) 确保 build/ 是合法的 Bazel 包
          if [[ ! -f "$BUILD_PKG/BUILD.bazel" && ! -f "$BUILD_PKG/BUILD" ]]; then
            echo "build/ 缺少 BUILD 文件，创建空的 BUILD.bazel"
            : > "$BUILD_PKG/BUILD.bazel"
          else
            echo "build/ 已有 BUILD 文件"
          fi

          # 2) 确保 msm_kernel_extensions.bzl 存在
          EXT="$BUILD_PKG/msm_kernel_extensions.bzl"
          if [[ ! -e "$EXT" ]]; then
            SRC="$KERNEL_ROOT/msm-kernel/msm_kernel_extensions.bzl"
            if [[ -f "$SRC" ]]; then
              echo "从 msm-kernel 复制 msm_kernel_extensions.bzl"
              cp "$SRC" "$EXT"
            else
              echo "::error::找不到 msm_kernel_extensions.bzl 源文件: $SRC"
              exit 1
            fi
          else
            echo "msm_kernel_extensions.bzl 已存在"
          fi

          echo "=== build/ 目录内容 ==="
          ls -la "$BUILD_PKG" | head -10

          # 3) 补齐 vendor 设备树
          # Xiaomi 内核树的 arch/arm64/boot/dts/vendor 是一个符号链接:
          #   ../../../../../qcom/proprietary/devicetree
          # 即指向 <工作区根>/qcom/proprietary/devicetree，该目录不在
          # Xiaomi_Kernel_OpenSource 仓库内，而是独立的 MiCode/kernel_devicetree。
          # 缺失时 Bazel 会报:
          #   Label '//msm-kernel/arch/arm64/boot/dts/vendor:qcom/platform_map.bzl'
          #   is invalid because '.../vendor' is not a package
          DT_LINK="$KERNEL_ROOT/msm-kernel/arch/arm64/boot/dts/vendor"
          DT_DIR="$KERNEL_ROOT/qcom/proprietary/devicetree"

          if [[ -L "$DT_LINK" ]]; then
            echo "vendor 是符号链接 -> $(readlink "$DT_LINK")"
          else
            echo "::warning::vendor 不是符号链接，实际类型: $(stat -c %F "$DT_LINK" 2>/dev/null || echo 未知)"
          fi

          if [[ -f "$DT_DIR/qcom/platform_map.bzl" ]]; then
            echo "设备树已就位: $DT_DIR"
          else
            echo "克隆 Xiaomi 设备树 (分支: $XIAOMI_BRANCH)..."
            rm -rf "$DT_DIR"
            mkdir -p "$(dirname "$DT_DIR")"
            git clone --depth 1 "$XIAOMI_DT_REPO" "$DT_DIR" -b "$XIAOMI_BRANCH"

            if [[ ! -f "$DT_DIR/qcom/platform_map.bzl" ]]; then
              echo "::error::设备树克隆后仍缺少 qcom/platform_map.bzl"
              ls -la "$DT_DIR" | head -10
              exit 1
            fi
            echo "设备树克隆完成"
          fi

          echo "=== 校验 vendor 链接可达 ==="
          if [[ -f "$DT_LINK/qcom/platform_map.bzl" ]]; then
            echo "OK: vendor/qcom/platform_map.bzl 可访问"
          else
            echo "::error::通过 vendor 链接无法访问 qcom/platform_map.bzl"
            exit 1
          fi

          # 5) 放宽 Kleaf 内部 .bzl 的加载可见性
          # Xiaomi 树 msm-kernel/*.bzl 会 load Kleaf 内部实现文件，例如
          #   load("//build/kernel/kleaf/impl:image/image_utils.bzl", ...)
          # 较新的 Kleaf 给这些文件加了
          #   visibility("//build/kernel/kleaf/...")
          # 于是从 //msm-kernel 加载被拒:
          #   Starlark file ... is not visible for loading from package //msm-kernel
          #
          # 为什么不能只靠命令行参数：
          #   该检查在 `bazel query` 阶段就会触发，而 build_with_bazel.py 先跑
          #   query 再跑 build；query 不接收 --check_bzl_visibility（那是
          #   build 参数），因此仅靠传参无法绕过。这里直接放宽声明。
          #
          # 语法要点: .bzl 的 visibility() 接受的是「包规范」而非 label，
          #   正确: visibility("public")
          #   错误: visibility("//visibility:public")  -> invalid package name
          # 影响范围: 仅 Starlark 加载权限，不改变任何编译产物。
          BUILD_DIR="$KERNEL_ROOT/build"
          if [[ -d "$BUILD_DIR" ]]; then
            mapfile -t VFILES < <(grep -rl 'visibility("//build/' --include='*.bzl' "$BUILD_DIR" 2>/dev/null || true)
            echo "含 Kleaf 内部可见性声明的 .bzl 文件: ${#VFILES[@]} 个"

            if [[ "${#VFILES[@]}" -gt 0 ]]; then
              for f in "${VFILES[@]}"; do
                # 单值形式: visibility("//build/kernel/kleaf/...")
                sed -i -E 's|visibility\("//build/[^"]*"\)|visibility("public")|g' "$f"
                # 列表形式: visibility(["//build/...", "//build/..."])
                sed -i -E 's|visibility\(\[[^]]*"//build/[^]]*\]\)|visibility("public")|g' "$f"
              done
              echo "已放宽 ${#VFILES[@]} 个文件的加载可见性"
              echo "--- 抽查结果 ---"
              grep -rn 'visibility(' "${VFILES[0]}" | head -3
            else
              echo "::warning::未发现需要放宽的 visibility 声明"
            fi

            # 复核: 确认已无残留的内部可见性限制
            REMAIN="$(grep -rl 'visibility("//build/\|visibility(\[[^]]*"//build/' --include='*.bzl' "$BUILD_DIR" 2>/dev/null | head -5 || true)"
            if [[ -n "$REMAIN" ]]; then
              echo "::error::以下文件仍存在内部可见性限制:"
              echo "$REMAIN"
              exit 1
            fi
            echo "OK: 已无残留的内部可见性限制"

            # 复核: 确认未引入非法 label 语法
            BAD="$(grep -rl 'visibility("//visibility:' --include='*.bzl' "$BUILD_DIR" 2>/dev/null | head -3 || true)"
            if [[ -n "$BAD" ]]; then
              echo "::error::检测到非法 visibility 语法 (label 形式):"
              echo "$BAD"
              exit 1
            fi
            echo "OK: visibility 语法正确"
          else
            echo "::warning::$BUILD_DIR 不存在，跳过可见性放宽"
          fi

          # 6) 处理未开源的 vendor 模块引用
          # Xiaomi 树引用了若干未随开源代码发布的目录，Kconfig 的 source 指令
          # 遇到不存在的文件会直接报错终止（不是警告），例如：
          #   drivers/misc/Kconfig:540: can't open file "drivers/misc/hwid/Kconfig"
          # 该模块在树里还有两处配套引用，必须一并清理，否则 Kleaf 的
          # defconfig fragment 校验会失败：
          #   arch/arm64/configs/vendor/manet_GKI.config: CONFIG_MI_HARDWARE_ID=m
          #     -> ERROR! Defconfig fragment did not apply as expected
          #        -MI_HARDWARE_ID m
          #   modules.list.msm.manet: hwid.ko
          #     -> 模块列表要求产出该 .ko，但源码不存在
          # 处理策略: 对每个「目录缺失的 source 行」，推导其所属 CONFIG 符号
          # （从同级 Makefile 的 obj-$(CONFIG_X) += 目录/ 得到），
          # 再移除各 vendor config 中的该符号与 modules.list 中的该 .ko。
          COMMON_DIR="$KERNEL_ROOT/common"
          echo "=== 扫描缺失的 Kconfig source 引用 ==="
          total_fixed=0
          for TREE in "$COMMON_DIR" "$KERNEL_ROOT/msm-kernel"; do
            [[ -d "$TREE" ]] || continue
            while IFS= read -r kfile; do
              rel_found=""
              while IFS= read -r rel; do
                [[ -n "$rel" ]] || continue
                # 跳过含 Kconfig 变量的路径，例如
                #   source "arch/$(SRCARCH)/Kconfig"
                # 这类路径由 Kconfig 在运行时展开，静态判断必然误报缺失。
                if [[ "$rel" == *'$('* ]]; then
                  continue
                fi
                kdir="$(dirname "$kfile")"
                # source 路径可能相对当前 Kconfig，也可能相对树根
                if [[ ! -e "$kdir/$rel" && ! -e "$TREE/$rel" ]]; then
                  rel_found="$rel_found $rel"
                fi
              done < <(sed -n 's/^[[:space:]]*source "\([^"]*\)".*$/\1/p' "$kfile" 2>/dev/null || true)

              for rel in $rel_found; do
                # 目录名（如 hwid）与 Makefile 所在目录
                # 注意: source 目标通常是 "<dir>/Kconfig"，此时模块名取目录名；
                #       若 target 不是 Kconfig 则直接用文件名。
                mod_dir="$(basename "$(dirname "$rel")")"
                mod_name="$(basename "$rel")"
                [[ "$mod_name" == "Kconfig" ]] && mod_name="$mod_dir"
                kdir="$(dirname "$kfile")"

                echo "  [$(echo "$kfile" | sed "s|$TREE/||")] 缺失 source: $rel (模块 $mod_name)"

                # (a) 注释 Kconfig source 行
                sed -i "s|^[[:space:]]*source \"${rel}\"[[:space:]]*\$|# &  # disabled: not published in OSS tree|" "$kfile"
                total_fixed=$((total_fixed+1))

                # (b) 从同级 Makefile 推导 CONFIG 符号
                mfile="$kdir/Makefile"
                sym=""
                if [[ -f "$mfile" ]]; then
                  sym="$(sed -n "s/^[[:space:]]*obj-\$(\(CONFIG_[A-Z0-9_]*\))[]:= ]*.*${mod_name}\/.*$/\1/p" "$mfile" | head -1)"
                fi
                if [[ -n "$sym" ]]; then
                  echo "      对应符号: $sym —— 从各 vendor config 中移除"
                  mapfile -t cfgs < <(find "$TREE/arch/arm64/configs" -name '*.config' -type f 2>/dev/null || true)
                  for cfg in "${cfgs[@]}"; do
                    if grep -qE "^#?[[:space:]]*${sym}[= ]" "$cfg" 2>/dev/null; then
                      sed -i -E "s|^#?[[:space:]]*${sym}=.*$|# ${sym} is not set  # disabled: source not published|" "$cfg"
                      echo "      已清理 $(echo "$cfg" | sed "s|$TREE/||")"
                    fi
                  done
                else
                  echo "      ::warning::未能从 Makefile 推导 CONFIG 符号"
                fi

                # (c) 从 modules.list* 移除该模块的 .ko
                mapfile -t mlist < <(find "$TREE" -maxdepth 1 -name 'modules.list*' -type f 2>/dev/null || true)
                for ml in "${mlist[@]}"; do
                  if grep -qE "^[[:space:]]*${mod_name}\.ko[[:space:]]*$" "$ml" 2>/dev/null; then
                    sed -i -E "/^[[:space:]]*${mod_name}\.ko[[:space:]]*$/d" "$ml"
                    echo "      已从 $(basename "$ml") 移除 ${mod_name}.ko"
                  fi
                done
              done
            done < <(find "$TREE" -name Kconfig -type f 2>/dev/null)
          done

          echo "全树共处理 $total_fixed 处缺失的 Kconfig source 引用"
          if [[ "$total_fixed" -gt 0 ]]; then
            echo "--- 复查 ---"
            echo "[Kconfig] $(grep -rn "hwid/Kconfig" "$COMMON_DIR" "$KERNEL_ROOT/msm-kernel" 2>/dev/null | head -2 || echo '无')"
            echo "[config  ] $(grep -rn "MI_HARDWARE_ID=" "$COMMON_DIR" "$KERNEL_ROOT/msm-kernel" 2>/dev/null | head -3 || echo '无')"
            echo "[modules ] $(grep -rn '^hwid\.ko' "$COMMON_DIR" "$KERNEL_ROOT/msm-kernel" 2>/dev/null | head -2 || echo '无')"
          fi

      # ==================== 构建内核 ====================
      # 超时策略说明:
      #   作业级 timeout-minutes 是硬上限，超出会被 GitHub 直接取消（失败），
      #   已产出的中间物与 upload-artifact 步骤都不会执行 —— 即本次构建白跑。
      #   因此作业级给足余量(240)，构建步骤自身设 100 分钟并在超时后重试：
      #   重试时 ccache 与 Bazel 磁盘缓存已是热的，通常能显著缩短。
      - name: 构建 manet GKI 内核
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 100
          max_attempts: 2
          # Bazel 首次构建需联网拉取工具链/BUILD 依赖，网络抖动会造成失败，
          # 故对任意失败都重试一次（第二次已有 ccache 与 Bazel 磁盘缓存，更快）。
          retry_on: any
          command: |
            set -ex
            cd "$KERNEL_ROOT"

            # Xiaomi 官方脚本先构建，再运行 *_dist 目标导出 dist 目录。
            # fragment 文件由补丁脚本生成在 common/arch/arm64/configs/ksu.fragment。
            FRAG_FLAG=""
            FRAG="common/arch/arm64/configs/ksu.fragment"
            if [[ -s "$FRAG" ]]; then
              FRAG_FLAG="--defconfig_fragment=//common:arch/arm64/configs/ksu.fragment"
            fi

            echo "=== Fragment 内容 ==="
            cat "$FRAG"
            echo "======================"

            # 说明: Kleaf 内部 .bzl 的加载可见性已在“准备 Bazel 工作区”
            # 步骤中放宽为 public（该检查在 query 阶段触发，传参无法绕过）。
            #
            # --skip abl --skip dtc:
            #   manet_gki_dist 会连带产出 *_abl_dist / *_dtc_dist，二者分别依赖
            #   bootable/bootloader/edk2 与 @dtc 外部仓库，本次未提供，会报:
            #     no such package '@dtc//': Repository '@dtc' is not defined
            #     no such package 'bootable/bootloader/edk2': BUILD file not found
            #   这两个产物（引导加载程序、设备树编译器）与内核镜像无关，
            #   本流程只需要 Image，故按 build_with_bazel.py 的 --skip 机制跳过。
            python3 msm-kernel/build_with_bazel.py \
              -t manet gki \
              --skip abl \
              --skip dtc \
              --disk_cache="$HOME/.cache/bazel" \
              --config=fast \
              --lto=thin \
              $FRAG_FLAG

            # 官方脚本将导出产物放入 out/msm-kernel-manet-gki/dist。
            DIST_DIR="$KERNEL_ROOT/out/msm-kernel-manet-gki/dist"
            if [[ ! -d "$DIST_DIR" ]]; then
              echo "::error::dist 目录不存在: $DIST_DIR"
              exit 1
            fi

            echo "=== dist 目录内容 ==="
            ls -la "$DIST_DIR/"
            IMAGE_FILE="$(find "$DIST_DIR" -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.lz4' \) -print -quit)"
            if [[ -z "$IMAGE_FILE" ]]; then
              echo "::error::dist 目录中未找到内核镜像"
              exit 1
            fi
            echo "找到内核镜像: $IMAGE_FILE"
            strings "$IMAGE_FILE" | grep 'Linux version'

      # ==================== 打包 dist 产物 ====================
      - name: 打包 dist 产物
        run: |
          DIST_DIR="$KERNEL_ROOT/out/msm-kernel-manet-gki/dist"
          if [[ ! -d "$DIST_DIR" ]]; then
            echo "::error::dist 目录不存在: $DIST_DIR"
            exit 1
          fi

          ARCHIVE_NAME="manet-gki-kernel-dist-$(date -u +%Y%m%d-%H%M%S).tar.gz"
          echo "打包 dist 产物: $ARCHIVE_NAME"
          tar -czf "$GITHUB_WORKSPACE/$ARCHIVE_NAME" -C "$DIST_DIR" .
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

          # 显示产物大小
          ls -lh "$GITHUB_WORKSPACE/$ARCHIVE_NAME"

      # ==================== 制作 AnyKernel3 可刷入包 ====================
      # 只替换 boot 分区里的内核镜像，不动 ramdisk/dtb/数据。
      # manet 的 ramdisk 位于 init_boot 分区，故 AK3 无需处理 ramdisk。
      - name: 制作 AnyKernel3 可刷入包
        if: ${{ inputs.build_anykernel3 }}
        run: |
          set -euo pipefail

          DIST_DIR="$KERNEL_ROOT/out/msm-kernel-manet-gki/dist"
          IMAGE_FILE="$(find "$DIST_DIR" -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.lz4' \) -print -quit)"
          if [[ -z "$IMAGE_FILE" ]]; then
            echo "::error::dist 目录中未找到内核镜像，无法制作 AnyKernel3"
            exit 1
          fi
          echo "使用内核镜像: $IMAGE_FILE"

          # AnyKernel3 官方模板(osm0sis)。ReSukiSU-GKI/AnyKernel3 已不可访问，
          # 改用上游模板自行配置设备参数。
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git "$GITHUB_WORKSPACE/AnyKernel3"
          rm -rf "$GITHUB_WORKSPACE/AnyKernel3/.git"
          rm -rf "$GITHUB_WORKSPACE/AnyKernel3/.github"

          AK3="$GITHUB_WORKSPACE/AnyKernel3"

          # 写入 manet 专用配置
          # block=boot            -> 内核在 boot 分区(ramdisk 在 init_boot，AK3 不处理)
          # do.devicecheck=1      -> 防止刷到别的机型
          # no_magisk_check=1     -> 允许在已 root 环境刷入
          cat > "$AK3/anykernel.sh" <<'AK3EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=manet GKI (ReSukiSU + SUSFS + Droidspaces)
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          do.check_boot_version=0
          device.name1=manet
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot shell variables
          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_magisk_check=1

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh

          # manet 的 ramdisk 在 init_boot 分区，boot 分区只有内核。
          # 无 ramdisk 时走 flash_boot，有则走 unpack_ramdisk + write_boot
          # （与社区已验证的 GKI 内核包写法一致）
          split_boot

          if [ -f "$SPLITIMG/ramdisk.cpio" ]; then
            unpack_ramdisk
            write_boot
          else
            flash_boot
          fi
          AK3EOF

          # heredoc 内容带有 YAML 缩进，需去掉行首空格还原为合法 shell
          sed -i 's/^          //' "$AK3/anykernel.sh"
          echo "=== anykernel.sh 语法检查 ==="
          bash -n "$AK3/anykernel.sh" && echo "OK"
          grep -n "device.name1\|block=\|do.devicecheck" "$AK3/anykernel.sh"

          cp "$IMAGE_FILE" "$AK3/Image"

          ZIP_NAME="manet-AnyKernel3-$(date -u +%Y%m%d-%H%M%S).zip"
          ( cd "$AK3" && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" ./* -x '*.git*' )
          echo "AK3_ZIP=$ZIP_NAME" >> $GITHUB_ENV

          echo "=== AnyKernel3 包内容 ==="
          unzip -l "$GITHUB_WORKSPACE/$ZIP_NAME" | head -25
          ls -lh "$GITHUB_WORKSPACE/$ZIP_NAME"

      # ==================== 上传 AnyKernel3 包 ====================
      - name: 上传 AnyKernel3 包
        if: ${{ inputs.build_anykernel3 }}
        uses: actions/upload-artifact@v6
        with:
          name: manet-AnyKernel3
          path: ${{ env.AK3_ZIP }}
          compression-level: 0
          if-no-files-found: error

      # ==================== 上传内核产物 ====================
      - name: 上传内核 dist 产物
        uses: actions/upload-artifact@v6
        with:
          name: manet-gki-kernel-dist
          path: ${{ env.ARCHIVE_NAME }}
          compression-level: 0
          if-no-files-found: error

      # ==================== 上传补丁冲突文件 ====================
      - name: 上传补丁冲突文件
        if: always() && env.REJ_COUNT > 0
        uses: actions/upload-artifact@v6
        with:
          name: manet-gki-kernel-rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9
